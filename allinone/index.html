<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Lexend:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      /* Paint the page ground before the stylesheet loads (values from styles/tokens.css). */
      html { background-color: #eff1f3; color-scheme: light; }
      html[data-theme='sepia'] { background-color: #efe6d4; color-scheme: light; }
      html[data-theme='dark'] { background-color: #121823; color-scheme: dark; }
    </style>
    <script>
      (function() {
        try {
          var themes = ['light', 'sepia', 'dark'];
          var storedTheme = localStorage.getItem('theme');
          if (storedTheme && themes.indexOf(storedTheme) !== -1) {
            document.documentElement.setAttribute('data-theme', storedTheme);
          } else if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
            document.documentElement.setAttribute('data-theme', 'dark');
          } else {
            document.documentElement.setAttribute('data-theme', 'light');
          }
        } catch (e) {
          // Catch errors in case localStorage is disabled/blocked
        }
      })();
    </script>
    <title>Allinone</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
