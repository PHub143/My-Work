<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap');
  body {
    font-family: 'IBM Plex Sans', -apple-system, sans-serif;
    display: flex;
    flex-direction: column;
    gap: 16px;
    padding: 24px;
    margin: 0;
    background: #0e1216;
  }
  .swatch { padding: 24px; border-radius: 16px; background: #14181d; }
  .swatch.narrow { width: 360px; }
  .swatch.medium { width: 560px; }

  .ybm-page {
    --ybm-text: #fef9f0;
    --ybm-muted: #fef9f0;
    --ybm-card-bg: rgba(254, 249, 240, 0.06);
    --ybm-card-border: rgba(254, 249, 240, 0.18);
    --ybm-card-hover: rgba(254, 249, 240, 0.12);
    --ybm-accent: #9d8bff;
    --ybm-accent-text: #0a0612;
    --ybm-badge-bg: rgba(254, 249, 240, 0.14);
  }

  .ybm-crumbs {
    display: flex;
    align-items: center;
    gap: 0.85rem;
    margin: 0;
    flex-wrap: wrap;
  }
  .ybm-crumb-kicker {
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ybm-muted);
    opacity: 0.6;
    flex-shrink: 0;
  }
  .ybm-crumb-mark {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 1.15rem;
    height: 1.15rem;
    border-radius: 4px;
    background: var(--ybm-accent);
    color: var(--ybm-accent-text);
    font-size: 0.68rem;
    font-weight: 800;
  }
  .ybm-crumb-pills {
    display: inline-flex;
    align-items: center;
    gap: 0.2rem;
    padding: 0.2rem;
    border-radius: 999px;
    background: var(--ybm-badge-bg);
    border: 1px solid var(--ybm-card-border);
  }
  .ybm-crumb-pill {
    appearance: none;
    background: transparent;
    border: none;
    padding: 0.35rem 0.9rem;
    border-radius: 999px;
    font: inherit;
    font-size: 0.78rem;
    font-weight: 700;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--ybm-text);
    opacity: 0.62;
    cursor: pointer;
    white-space: nowrap;
    transition: background-color 0.18s ease, color 0.18s ease, opacity 0.18s ease;
  }
  .ybm-crumb-pill.is-active {
    opacity: 1;
    background: var(--ybm-accent);
    color: var(--ybm-accent-text);
    cursor: default;
  }

  h2 { color: #97a1ad; font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .08em; margin: 0 0 12px; }
</style>
</head>
<body>
  <div class="swatch">
    <h2>Full width — 5 collections</h2>
    <div class="ybm-page">
      <nav class="ybm-crumbs">
        <span class="ybm-crumb-kicker"><span class="ybm-crumb-mark">T</span>TOEIC</span>
        <div class="ybm-crumb-pills">
          <button class="ybm-crumb-pill is-active">YBM</button>
          <button class="ybm-crumb-pill">Hacker</button>
          <button class="ybm-crumb-pill">ETS</button>
          <button class="ybm-crumb-pill">Cactus</button>
          <button class="ybm-crumb-pill">Wills</button>
        </div>
      </nav>
    </div>
  </div>

  <div class="swatch medium">
    <h2>560px card — 5 collections</h2>
    <div class="ybm-page">
      <nav class="ybm-crumbs">
        <span class="ybm-crumb-kicker"><span class="ybm-crumb-mark">T</span>TOEIC</span>
        <div class="ybm-crumb-pills">
          <button class="ybm-crumb-pill is-active">YBM</button>
          <button class="ybm-crumb-pill">Hacker</button>
          <button class="ybm-crumb-pill">ETS</button>
          <button class="ybm-crumb-pill">Cactus</button>
          <button class="ybm-crumb-pill">Wills</button>
        </div>
      </nav>
    </div>
  </div>

  <div class="swatch narrow">
    <h2>360px card (mobile) — 5 collections</h2>
    <div class="ybm-page">
      <nav class="ybm-crumbs">
        <span class="ybm-crumb-kicker"><span class="ybm-crumb-mark">T</span>TOEIC</span>
        <div class="ybm-crumb-pills">
          <button class="ybm-crumb-pill is-active">YBM</button>
          <button class="ybm-crumb-pill">Hacker</button>
          <button class="ybm-crumb-pill">ETS</button>
          <button class="ybm-crumb-pill">Cactus</button>
          <button class="ybm-crumb-pill">Wills</button>
        </div>
      </nav>
    </div>
  </div>
</body>
</html>
